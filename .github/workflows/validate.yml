name: Validate

# Continuous validation of the library's invariants.
#
#   - the registry parses and agrees with .gitmodules in both directions
#   - generated documentation is not stale
#   - every ingested source still carries the licence we recorded
#   - our internal packages typecheck and pass their tests
#   - a sync branch has not touched anything except a submodule pointer
#
# Also runs weekly so upstream relicensing is caught even when nobody pushes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Registry, docs and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Submodules ARE checked out here so the licence audit can confirm
          # the upstream LICENSE files physically exist next to the code.
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Registry schema and .gitmodules consistency
        run: npm run validate:registry

      - name: Generated docs are up to date
        run: npm run docs:check

      - name: Licence audit (local files + upstream SPDX)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/license-audit.mjs --remote

      - name: Upstream drift report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Upstream drift'
            echo ''
            echo '```'
            node scripts/check-upstream.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Catalogued (reference-only) sources have no pinned commit to drift.
      # What rots instead is the recommendation itself — the project gets
      # archived, relicensed, or renamed — so it is checked separately.
      - name: Catalog health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture first, then report, so a genuine failure (relicensed or
          # unreachable) still fails the job instead of being swallowed by the
          # exit status of the last `echo`.
          # `|| status=$?` because the default shell runs with `-e`: without
          # the guard, a failing check would abort the step before the report
          # is written.
          status=0
          node scripts/check-upstream.mjs --catalog > catalog-health.txt || status=$?
          {
            echo '## Catalog health'
            echo ''
            echo '```'
            cat catalog-health.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  guard:
    name: Sync branches touch upstream pointers only
    if: startsWith(github.head_ref, 'sync/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Guard internal code
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          node scripts/guard-internal.mjs --base "origin/${{ github.base_ref }}"

  internal:
    name: Internal package — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Our own code. Upstream submodules are deliberately NOT built here:
        # we track them for reference, we do not ship or compile them.
        package:
          - frontend/chartjs/examples
          - frontend/shadcn/templates
          - frontend/data/patterns
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test
