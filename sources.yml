    docs: https://base-ui.com/react/overview/quick-start
    install: npm i @base-ui-components/react
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: emerging
    vetted_at: '2026-09-15'
    description: >-
      Unstyled accessible primitives from the MUI team, with contributors from
      Radix and Floating UI. Modern API, actively developed.
    use_when: Starting something new that wants headless primitives and you are happy tracking a young API.
    avoid_when: >-
      A production system that must not absorb breaking changes — prefer Radix
