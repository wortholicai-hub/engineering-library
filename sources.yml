# =============================================================================
# Engineering Library — Upstream Source Registry
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for every upstream repository the
# Engineering Library tracks. Humans read it; automation parses it.
#
# Nothing in .github/workflows or scripts/ hardcodes a technology name.
# Adding a source here (plus `git submodule add` when its code is ingested) is
# all that is required to bring it into the sync system.
# See docs/adding-a-source.md.
#
# Schema is enforced by scripts/registry.mjs (run: npm run validate:registry).
# Candidates are vetted with scripts/vet-source.mjs BEFORE they are added here
# (run: npm run vet -- owner/repo) — licence, maintenance and weight are
# checked against the GitHub API, never assumed.
# -----------------------------------------------------------------------------
# THE TWO AXES
#
#   sync_method  — is the upstream CODE ingested?
#     git-submodule   Pinned gitlink. The code is on disk, read-only, at an
#                     exact commit. Choose this when reading the source is
#                     genuinely useful (API truth, a starter to copy from).
#     reference-only  Nothing is ingested. The library records the repository,
#                     its licence, its docs and our house guidance, and the
#                     automation monitors it for releases, archival and
#                     relicensing. Choose this for anything consumed from npm
#                     or too heavy to clone in CI (see SUBMODULE_SIZE_LIMIT_KB
#                     in scripts/vet-source.mjs).
#
#   coupling     — does OUR code depend on it?
#     type-coupled    Our internal package compiles against its types. An
#                     upstream change can break us, so the sync runs that
#                     package's typecheck + tests as the gate. Requires
#                     `internal_dir`.
#     reference       Nothing of ours compiles against it, so an upstream bump
#                     cannot break our build. `internal_dir` may be null.
#
# These are independent: a starter template is `git-submodule` + `reference`
# (its code is on disk to read, but nothing of ours imports it).
# -----------------------------------------------------------------------------
# FIELD REFERENCE
#   name          Unique slug. Also used in sync branch names.
#   title         Human name.
#   category      Top-level library section (frontend, backend, ai, ...).
#   group         Catalog group. MUST match an id in the `groups:` list below.
#   upstream      Canonical HTTPS URL of the OFFICIAL upstream repository.
#   ref           Upstream branch we track. NOT assumed to be "main" —
#                 Chart.js tracks "master", Next.js tracks "canary".
#   sync_method   See above.
#   coupling      See above.
#   path          Where the upstream code lives. For git-submodule this MUST
#                 match the submodule path in .gitmodules (validated).
#                 Always null for reference-only.
#   internal_dir  Where OUR OWN code for this technology lives. The sync
#                 automation is forbidden from writing anywhere inside it.
#   docs          Official documentation URL. Required for every enabled
#                 source — a catalog entry nobody can read is useless.
#   install       The command that adds it to a product repository.
#   license       SPDX id verified against the GitHub API at registration time
#                 and re-verified on every sync (license regression detection).
#   license_detected  Only when GitHub CANNOT classify the licence (SPDX
#                 `NOASSERTION`). Records what the API reports so the audit can
#                 still detect change, while `license` records what a human
#                 read. Requires `license_review`.
#   license_review    The human decision that justifies `license_detected`.
#   license_ok    Whether the license permits our intended use (reference +
#                 derive internal wrappers with attribution).
#   enabled       false => excluded from automated sync. Reason must be given.
#   update_strategy  How a detected upstream update reaches the default branch:
#                 "auto"         -> run the full validation gate, then commit
#                                   straight to the default branch. No human
#                                   step. The validation gate is the ONLY
#                                   safeguard, so it must be meaningful.
#                 "pull-request" -> open a PR and wait for a human to merge.
#                 Switching a source to "pull-request" is the way to put a
#                 human back in the loop for a risky dependency.
#   maturity      standard | established | emerging. `standard` means "pick
#                 this unless you have a reason not to".
#   use_when      One line: when this is the right choice.
#   avoid_when    One line: when it is the wrong choice. Kept deliberately —
#                 a catalog that only lists strengths cannot be used to decide.
#   alternatives  Names of other sources in this registry that solve the same
#                 problem.
#   tags          Free-form search keywords for humans and agents.
#   vetted_at     Date the licence + maintenance status were last verified
#                 against the GitHub API with scripts/vet-source.mjs.
#   maintenance_note  Recorded when a source is stable-but-quiet or carries a
#                 maintenance risk. Honesty beats a clean-looking table.
# =============================================================================

version: 1

defaults:
  sync_method: git-submodule
  # Fully autonomous by default: detect -> validate -> commit to main.
  update_strategy: auto
  # Most sources are reference material; type-coupling is the exception and is
  # always declared explicitly.
  coupling: reference
  # How far back to summarise upstream commits in the commit/PR body.
  pr_commit_preview: 20

# -----------------------------------------------------------------------------
# CATALOG GROUPS
# Ordered as a developer should read them: what renders your UI, what gives it
# behaviour, what moves your data, then everything around it.
# docs/frontend-catalog.md is generated from these.
# -----------------------------------------------------------------------------
groups:
  - id: component-systems
    title: Complete component systems
    summary: >-
      Batteries-included libraries that ship a themed component for almost
      everything. Fastest route to a working product UI; you adopt their design
      language and their styling engine.

  - id: tailwind-systems
    title: Tailwind-native component systems
    summary: >-
      Components built on Tailwind utility classes. You own the code (copy-in)
      or the classes (plugin), so restyling never means fighting a theme API.

  - id: headless
    title: Headless primitives and accessibility
    summary: >-
      Unstyled, fully accessible behaviour — focus traps, keyboard navigation,
      ARIA wiring. The layer underneath shadcn/ui and every serious design
      system. Use these when your brand cannot look like anyone else's.

  - id: data
    title: Data, forms, state and validation
    summary: >-
      The non-visual half of a frontend: fetching and caching, tables, forms,
      schema validation, client state, routing.

  - id: charts
    title: Charts and data visualisation
    summary: Rendering numbers. Canvas, SVG and dashboard-oriented options.

  - id: interaction
    title: Motion, icons and rich interaction
    summary: >-
      Animation, icon sets, drag and drop, rich text, command palettes, toasts,
      drawers and resizable panels — the pieces a product needs once the
      skeleton works.

  - id: templates
    title: Production starter templates
    summary: >-
      Whole applications, not components. Clone one of these when starting a
      new product: auth, billing, database, CI and project structure are
      already wired together by people who ship.

  - id: platform
    title: Framework, styling and quality tooling
    summary: >-
      The foundation every frontend here sits on — framework, CSS engine,
      component workshop, end-to-end testing.

sources:
  # ===========================================================================
  # TAILWIND-NATIVE COMPONENT SYSTEMS
  # ===========================================================================
  - name: shadcn-ui
    title: shadcn/ui
    category: frontend
    group: tailwind-systems
    upstream: https://github.com/shadcn-ui/ui
    ref: main
    sync_method: git-submodule
    coupling: type-coupled
    path: frontend/shadcn/upstream/ui
    internal_dir: frontend/shadcn/templates
    docs: https://ui.shadcn.com
    install: npx shadcn@latest init
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: auto
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Composable, accessible React components you copy into your own codebase
      rather than install. Built on Radix primitives + Tailwind. Source of
      truth for component anatomy, Tailwind class conventions and the `cn`
      utility pattern.
    use_when: >-
      Default choice for any new React product UI where the design must be ours
      and the components must be editable.
    avoid_when: >-
      You need a full themed component set out of the box with no design work —
      use Mantine or MUI instead.
    alternatives: [mantine, mui-material, heroui, flowbite-react]
    tags: [components, tailwind, radix, react, copy-paste, blocks, dashboard]
    used_for:
      - React component primitives and their accessibility semantics
      - Tailwind design-token and variant conventions
      - Reference implementation for our internal wrappers
      - Blocks: dashboards, sidebars, login screens, data tables

  - name: daisyui
    title: daisyUI
    category: frontend
    group: tailwind-systems
    upstream: https://github.com/saadeghi/daisyui
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://daisyui.com
    install: npm i -D daisyui@latest
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      A Tailwind CSS plugin that adds semantic component class names
      (`btn`, `card`, `modal`) plus a large set of themes. Pure CSS: no
      JavaScript, no React dependency.
    use_when: >-
      You want good-looking components fast in any framework, or a themeable
      marketing site, without shipping component JavaScript.
    avoid_when: >-
      You need accessible interactive behaviour — daisyUI styles markup, it
      does not manage focus, keyboard or ARIA. Pair it with headless
      primitives, or use shadcn/ui.
    alternatives: [shadcn-ui, flowbite-react]
    tags: [tailwind, css, themes, plugin, framework-agnostic]

  - name: flowbite-react
    title: Flowbite React
    category: frontend
    group: tailwind-systems
    upstream: https://github.com/themesberg/flowbite-react
    ref: main
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://flowbite-react.com/docs/getting-started/introduction
    install: npx flowbite-react@latest init
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: established
    vetted_at: '2026-09-15'
    description: >-
      Tailwind-based React component library with a large catalogue of
      ready-made blocks — navbars, sidebars, CRUD tables, pricing sections,
      authentication screens.
    use_when: >-
      Building an internal tool or admin area quickly and the standard
      Flowbite look is acceptable.
    avoid_when: >-
      The product needs a distinctive design system; you will spend longer
      overriding than composing.
    alternatives: [shadcn-ui, daisyui, mantine]
    tags: [tailwind, react, components, admin, blocks]

  - name: magic-ui
    title: Magic UI
    category: frontend
    group: tailwind-systems
    upstream: https://github.com/magicuidesign/magicui
    ref: main
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://magicui.design/docs
    install: npx shadcn@latest add "https://magicui.design/r/marquee.json"
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: established
    vetted_at: '2026-09-15'
    description: >-
      150+ animated components distributed through the shadcn CLI — marquees,
      beams, number tickers, gradient text, hero sections. Drops into an
      existing shadcn/ui project with no new runtime concepts.
    use_when: Landing pages and marketing surfaces that need motion without bespoke animation work.
    avoid_when: >-
      Dense application UI — the animation budget belongs on the marketing
      site, not on a data table.
    alternatives: [motion]
    tags: [animation, landing-page, marketing, shadcn, tailwind, motion]

  - name: tremor
    title: Tremor
    category: frontend
    group: tailwind-systems
    upstream: https://github.com/tremorlabs/tremor
    ref: main
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://tremor.so
    install: npm i @tremor/react
    license: Apache-2.0
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: established
    vetted_at: '2026-09-15'
    maintenance_note: >-
      No upstream push for ~340 days as of the vetting date. Treat as
      feature-complete rather than actively developed, and prefer
      Chart.js/Recharts for the charting layer of anything long-lived.
    description: >-
      Dashboard-oriented React components — KPI cards, trackers, bar lists and
      charts — designed to look right together with minimal configuration.
    use_when: An internal analytics dashboard is needed in days, not weeks.
    avoid_when: The dashboard is a long-lived core product surface (see the maintenance note).
    alternatives: [shadcn-ui, recharts, chartjs]
    tags: [dashboard, analytics, kpi, charts, tailwind, react]

  # ===========================================================================
  # COMPLETE COMPONENT SYSTEMS
  # ===========================================================================
  - name: mui-material
    title: MUI (Material UI)
    category: frontend
    group: component-systems
    upstream: https://github.com/mui/material-ui
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://mui.com/material-ui/getting-started/
    install: npm i @mui/material @emotion/react @emotion/styled
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      The most widely deployed React component library. Implements Material
      Design, with an enormous component surface, a mature theming system and
      commercial add-ons (Data Grid Pro, Date Pickers, Charts).
    use_when: >-
      Enterprise or internal applications where breadth, documentation and
      hiring pool matter more than visual differentiation — and when you want
      a supported paid data grid rather than building one.
    avoid_when: >-
      You are already on Tailwind, or the brand must not read as Material
      Design. Runtime CSS-in-JS also costs more than utility classes.
    alternatives: [ant-design, mantine, chakra-ui, shadcn-ui]
    tags: [react, material-design, enterprise, data-grid, theming, components]

  - name: ant-design
    title: Ant Design
    category: frontend
    group: component-systems
    upstream: https://github.com/ant-design/ant-design
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://ant.design/components/overview/
    install: npm i antd
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Enterprise-grade React component system from Ant Group. Exceptional
      coverage of dense data UI: tables with filters and grouping, complex
      forms, transfer lists, tree selects.
    use_when: >-
      Back-office, admin and data-heavy internal tools — its table and form
      components are the strongest in the ecosystem out of the box.
    avoid_when: Consumer-facing products where the Ant look is hard to shake off, or when bundle size is critical.
    alternatives: [mui-material, mantine, primereact]
    tags: [react, enterprise, admin, tables, forms, back-office]

  - name: mantine
    title: Mantine
    category: frontend
    group: component-systems
    upstream: https://github.com/mantinedev/mantine
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://mantine.dev
    install: npm i @mantine/core @mantine/hooks
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      120+ components and 70+ hooks with first-class TypeScript, a genuinely
      good dark mode, and built-in form, notification, modal-manager and
      date-picker packages. CSS modules rather than runtime CSS-in-JS.
    use_when: >-
      You want a complete, modern component set with no design work and no
      Tailwind — the fastest path from zero to a polished internal product.
    avoid_when: >-
      The team is standardised on Tailwind, or you need the component code
      itself to be editable in-repo.
    alternatives: [mui-material, chakra-ui, shadcn-ui]
    tags: [react, components, hooks, typescript, dark-mode, forms, dates]

  - name: chakra-ui
    title: Chakra UI
    category: frontend
    group: component-systems
    upstream: https://github.com/chakra-ui/chakra-ui
    ref: main
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://chakra-ui.com/docs/get-started/installation
    install: npm i @chakra-ui/react @emotion/react
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Accessible React components with a style-props API and a strong design
      token system. Built on Ark UI, so behaviour and accessibility come from
      the same state machines.
    use_when: Teams that like composing with style props and want accessibility handled by default.
    avoid_when: You prefer utility classes (Tailwind) or need the widest possible component catalogue.
    alternatives: [mantine, mui-material, ark-ui]
    tags: [react, accessibility, design-tokens, style-props, components]

  - name: primereact
    title: PrimeReact
    category: frontend
    group: component-systems
    upstream: https://github.com/primefaces/primereact
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://primereact.org
    install: npm i primereact primeicons
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: established
    vetted_at: '2026-09-15'
    description: >-
      Very large component suite (80+) from PrimeFaces, including the kind of
      components most libraries skip: org charts, Gantt-style timelines,
      tree tables, spreadsheet-like data tables, file uploaders.
    use_when: >-
      An enterprise app needs an unusual heavy component and you would
      otherwise build it from scratch.
    avoid_when: You only need the common 20 components — lighter libraries will be easier to theme.
    alternatives: [ant-design, mui-material]
    tags: [react, enterprise, components, tree-table, org-chart, file-upload]

  - name: heroui
    title: HeroUI
    category: frontend
    group: component-systems
    upstream: https://github.com/heroui-inc/heroui
    ref: v3
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://www.heroui.com/docs/guide/introduction
    install: npm i @heroui/react
    license: Apache-2.0
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: established
    vetted_at: '2026-09-15'
    description: >-
      Modern React component library (formerly NextUI) built on Tailwind and
      React Aria — accessible behaviour with a polished default aesthetic.
      Tracked on the `v3` branch, which is where development happens.
    use_when: >-
      A consumer-facing product that should look designed on day one while
      keeping Tailwind and accessible primitives.
    avoid_when: >-
      You want the component source in your own repo — HeroUI is installed,
      not copied in. Note the major version in flight; pin carefully.
    alternatives: [shadcn-ui, mantine, react-aria]
    tags: [react, tailwind, react-aria, components, nextui]

  # ===========================================================================
  # HEADLESS PRIMITIVES AND ACCESSIBILITY
  # ===========================================================================
  - name: radix-primitives
    title: Radix Primitives
    category: frontend
    group: headless
    upstream: https://github.com/radix-ui/primitives
    ref: main
    sync_method: git-submodule
    coupling: reference
    path: frontend/headless/upstream/radix-primitives
    internal_dir: null
    docs: https://www.radix-ui.com/primitives
    install: npm i radix-ui
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: auto
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Unstyled, accessible React primitives — dialog, popover, select, menu,
      tooltip — with correct focus management, keyboard interaction and ARIA.
      This is what shadcn/ui is built on, so it is the authoritative answer to
      "why does this component behave like that?".
    use_when: >-
      Building a custom component that needs real accessibility, or debugging
      the behaviour of a shadcn/ui component.
    avoid_when: You want something that already looks finished — Radix ships zero styles by design.
    alternatives: [headless-ui, react-aria, base-ui, ark-ui]
    tags: [headless, accessibility, a11y, primitives, react, wai-aria, focus]
    used_for:
      - Accessibility and keyboard-interaction reference for our own components
      - Understanding the behaviour underneath shadcn/ui

  - name: headless-ui
    title: Headless UI
    category: frontend
    group: headless
    upstream: https://github.com/tailwindlabs/headlessui
    ref: main
    sync_method: git-submodule
    coupling: reference
    path: frontend/headless/upstream/headlessui
    internal_dir: null
    docs: https://headlessui.com
    install: npm i @headlessui/react
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: auto
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Unstyled accessible components from the Tailwind team, designed to be
      styled entirely with utility classes. Smaller surface than Radix but
      pairs naturally with Tailwind UI markup.
    use_when: A Tailwind project needs a handful of accessible interactive components and nothing more.
    avoid_when: You need the breadth Radix covers, or you are already using shadcn/ui (which brings Radix).
    alternatives: [radix-primitives, react-aria]
    tags: [headless, tailwind, accessibility, react, dropdown, dialog, combobox]
    used_for:
      - Tailwind-idiomatic accessible component patterns

  - name: react-aria
    title: React Aria (Adobe)
    category: frontend
    group: headless
    upstream: https://github.com/adobe/react-spectrum
    ref: main
    sync_method: reference-only
    coupling: reference
    path: null
    internal_dir: null
    docs: https://react-spectrum.adobe.com/react-aria/
    install: npm i react-aria-components
    license: Apache-2.0
    license_ok: true
    enabled: true
    update_strategy: pull-request
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      The most rigorous accessibility implementation in the React ecosystem:
      hooks and components covering internationalisation, right-to-left
      layouts, screen readers, touch and keyboard, from Adobe's Spectrum team.
    use_when: >-
      Accessibility is a contractual or regulatory requirement (public sector,
      enterprise procurement, WCAG audits), or you need full i18n/RTL support.
    avoid_when: A small project that only needs a dropdown — the API surface is large.
    alternatives: [radix-primitives, headless-ui, base-ui]
    tags: [accessibility, a11y, wcag, i18n, rtl, headless, hooks, react]

  - name: base-ui
    title: Base UI
    category: frontend
    group: headless
    upstream: https://github.com/mui/base-ui
    ref: master
    sync_method: reference-only
    coupling: reference
    path: null
