    use_when: You need one design system to work across more than one framework.
    avoid_when: A React-only codebase — Radix is more widely used and better documented for that case.
    alternatives: [radix-primitives, react-aria, base-ui]
    tags: [headless, state-machine, react, vue, solid, cross-framework]

  # ===========================================================================
  # DATA, FORMS, STATE AND VALIDATION
  # ===========================================================================
  - name: tanstack-table
    title: TanStack Table
    category: frontend
    group: data
    upstream: https://github.com/TanStack/table
    ref: main
    sync_method: git-submodule
    coupling: type-coupled
    path: frontend/data/upstream/table
    internal_dir: frontend/data/patterns
    docs: https://tanstack.com/table/latest
    install: npm i @tanstack/react-table
    license: MIT
    license_ok: true
    enabled: true
    update_strategy: auto
    maturity: standard
    vetted_at: '2026-09-15'
    description: >-
      Headless table logic — sorting, filtering, pagination, grouping, column
      visibility, row selection — with no markup of its own. The table engine
      shadcn/ui's data-table blocks are built on.
    use_when: Any table beyond a static list. Our own column/state helpers in `frontend/data/patterns` wrap it.
    avoid_when: >-
      You need a fully rendered spreadsheet grid with editing out of the box —
      that is MUI Data Grid Pro or AG Grid territory.
    alternatives: [ant-design, mui-material]
    tags: [table, datagrid, sorting, filtering, pagination, headless, react]
    used_for:
